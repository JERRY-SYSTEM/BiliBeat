name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的现有 Git tag，例如 v1.2.3'
        required: true
        type: string

jobs:
  build_env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Generate Build Number
        id: generate_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_VERSION="${COMMIT_COUNT}"

          echo "BUILD_VERSION=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "Generated BUILD_VERSION: ${BUILD_VERSION}"
        shell: bash

      - name: Update version in pubspec.yaml
        id: update_version_in_pubspec
        run: |
          MAIN_VERSION=$(grep "^version:" pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "MAIN_VERSION=${MAIN_VERSION}"

          FULL_VERSION="${MAIN_VERSION}+${{ steps.generate_version.outputs.BUILD_VERSION }}"
          echo "FULL_VERSION=${FULL_VERSION}"

          sed -i "s/^version: .*/version: ${FULL_VERSION}/" pubspec.yaml

          echo "Updated pubspec.yaml content:"
          cat pubspec.yaml

          if grep -q "^version: ${FULL_VERSION}" pubspec.yaml; then
            echo "Version updated successfully to ${FULL_VERSION}"
          else
            echo "Failed to update version"
            echo "Current version line:"
            grep "^version:" pubspec.yaml
            exit 1
          fi

          echo "FULL_VERSION=${FULL_VERSION}" > _build_env.config
        shell: bash

      - name: Upload updated pubspec.yaml
        uses: actions/upload-artifact@v4
        with:
          name: build_env_files
          path: |
            pubspec.yaml
            _build_env.config

  build_app:
    needs: build_env
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - name: ios-unsigned
            os: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download updated pubspec.yaml
        uses: actions/download-artifact@v4
        with:
          name: build_env_files

      - name: Replace pubspec.yaml
        run: |
          ls
          cat pubspec.yaml
          pwd
          cat _build_env.config
        shell: bash

      - name: Read FULL_VERSION from _build_env.config
        id: read_build_env
        run: |
          echo "Reading version from _build_env.config..."
          FULL_VERSION=$(grep 'FULL_VERSION=' _build_env.config | cut -d '=' -f2)
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Unsigned
        if: matrix.name == 'ios-unsigned'
        run: |
          flutter build ios --release --no-codesign

          echo "iOS build completed."
          echo "Runner.app:"
          ls -lah build/ios/iphoneos/
        shell: bash

      - name: Compress Build
        run: |
          if [ "${{ matrix.name }}" = "ios-unsigned" ]; then

            echo "Creating unsigned IPA..."

            rm -rf Payload
            mkdir -p Payload

            cp -R \
              build/ios/iphoneos/Runner.app \
              Payload/Runner.app

            zip -r \
              bilimusic_ios-unsigned-${{ steps.read_build_env.outputs.FULL_VERSION }}.ipa \
              Payload

            echo "Unsigned IPA created:"
            ls -lh *.ipa

            echo "IPA contents:"
            unzip -l \
              bilimusic_ios-unsigned-${{ steps.read_build_env.outputs.FULL_VERSION }}.ipa \
              | head -50
          fi
        shell: bash

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifact
          path: |
            *.ipa
            *.zip
          if-no-files-found: error

  release:
    needs: build_app
    runs-on: ubuntu-latest
  
    permissions:
      contents: write
  
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
  
      - name: Display structure of downloaded files
        run: ls -R artifacts
  
      - name: Read FULL_VERSION from _build_env.config
        id: read_build_env
        run: |
          echo "Reading version from _build_env.config..."
          FULL_VERSION=$(grep 'FULL_VERSION=' artifacts/build_env_files/_build_env.config | cut -d '=' -f2)
          echo "FULL_VERSION=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${FULL_VERSION}"
        shell: bash
  
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.ipa
            artifacts/**/*.zip
